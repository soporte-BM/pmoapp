name: Keep-Alive PMO App (Azure & SQL Warm-up)

on:
  schedule:
    # Corre cada 15 minutos de lunes a viernes
    # 11:00 UTC a 22:45 UTC equivale a 08:00 a 19:45 hora local (UTC-3: Chile / Brasil)
    - cron: '*/15 11-22 * * 1-5'
  workflow_dispatch: # Permite probar el ping manualmente desde la pestaña Actions en GitHub

jobs:
  ping:
    name: Ping Health & DB Warm-up
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping Azure Health & DB Endpoint
        run: |
          echo "Realizando ping de mantenimiento a Azure App Service y Azure SQL Database..."
          RESPONSE=$(curl -s -m 60 -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}s\n" "https://pmoapp-avbhckasgjbfcag4.brazilsouth-01.azurewebsites.net/health/db")
          echo "$RESPONSE"
          
          if echo "$RESPONSE" | grep -q "HTTP_STATUS:200"; then
            echo "✅ Ping exitoso: Backend y Base de Datos activos."
          else
            echo "⚠️ Advertencia: El servidor respondió con código distinto a 200 o tardó en responder."
          fi
